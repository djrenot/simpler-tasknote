<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク管理</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      padding: 24px 16px;
    }

    header {
      max-width: 1000px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
    }

    button.add-btn {
      padding: 5px 14px;
      background: #4a7cf7;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button.add-btn:hover { background: #3a6ce0; }

    .table-wrap {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    col.col-drag   { width: 28px; }
    col.col-id     { width: 72px; }
    col.col-name   { width: auto; }
    col.col-dead   { width: 130px; }
    col.col-memo   { width: 260px; }
    col.col-del    { width: 36px; }

    thead th {
      background: #f0f0f0;
      padding: 8px 6px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #ddd;
      user-select: none;
      white-space: nowrap;
    }
    thead th.sortable { cursor: pointer; }
    thead th.sortable:hover { background: #e4e4e4; }
    thead th .sort-arrow { margin-left: 4px; color: #888; font-size: 11px; }
    thead th.sorted .sort-arrow { color: #4a7cf7; }

    tbody tr {
      border-bottom: 1px solid #eee;
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafafa; }
    tbody tr.drag-over { background: #e8f0fe; }
    tbody tr.dragging  { opacity: 0.4; }

    td {
      padding: 4px 4px;
      vertical-align: middle;
    }

    .drag-handle {
      cursor: grab;
      color: #bbb;
      text-align: center;
      font-size: 16px;
      padding: 4px 2px;
      user-select: none;
    }
    .drag-handle:active { cursor: grabbing; }

    .cell-id {
      color: #888;
      text-align: right;
      padding-right: 10px;
      font-variant-numeric: tabular-nums;
    }

    td input[type="text"],
    td input[type="date"],
    td textarea {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      padding: 4px 6px;
      font-size: 14px;
      font-family: inherit;
      color: inherit;
      border-radius: 3px;
      outline: none;
      resize: none;
    }
    td input[type="text"]:focus,
    td input[type="date"]:focus,
    td textarea:focus {
      border-color: #4a7cf7;
      background: #fff;
    }
    td textarea {
      min-height: 28px;
      line-height: 1.4;
      overflow: hidden;
    }

    .del-btn {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 16px;
      padding: 4px 6px;
      border-radius: 3px;
      display: block;
      margin: 0 auto;
    }
    .del-btn:hover { color: #e55; background: #fee; }

    .empty-msg {
      text-align: center;
      color: #aaa;
      padding: 40px 0;
      font-size: 13px;
    }
  </style>
</head>
<body>

<header>
  <h1>タスク管理</h1>
  <button class="add-btn" onclick="addTask()">＋ タスクを追加</button>
</header>

<div class="table-wrap">
  <table>
    <colgroup>
      <col class="col-drag">
      <col class="col-id">
      <col class="col-name">
      <col class="col-dead">
      <col class="col-memo">
      <col class="col-del">
    </colgroup>
    <thead>
      <tr>
        <th></th>
        <th class="sortable" onclick="sortBy('id')">
          No <span class="sort-arrow">↕</span>
        </th>
        <th class="sortable" onclick="sortBy('name')">
          タスク名 <span class="sort-arrow">↕</span>
        </th>
        <th class="sortable" onclick="sortBy('deadline')">
          期限 <span class="sort-arrow">↕</span>
        </th>
        <th class="sortable" onclick="sortBy('memo')">
          メモ <span class="sort-arrow">↕</span>
        </th>
        <th></th>
      </tr>
    </thead>
    <tbody id="task-body"></tbody>
  </table>
  <div id="empty-msg" class="empty-msg" style="display:none">タスクがありません。「＋ タスクを追加」で追加してください。</div>
</div>

<script>
  // ── State ──────────────────────────────────────────────
  let tasks = [];
  let nextId = 1;
  let sortCol = null;
  let sortDir = 1; // 1=asc, -1=desc

  // ── Persistence ────────────────────────────────────────
  function save() {
    localStorage.setItem('tasknote', JSON.stringify({ tasks, nextId }));
  }

  function load() {
    try {
      const raw = localStorage.getItem('tasknote');
      if (!raw) return;
      const data = JSON.parse(raw);
      tasks  = data.tasks  || [];
      nextId = data.nextId || 1;
    } catch (_) {}
  }

  // ── Render ─────────────────────────────────────────────
  function render() {
    const tbody = document.getElementById('task-body');
    const emptyMsg = document.getElementById('empty-msg');

    emptyMsg.style.display = tasks.length === 0 ? '' : 'none';
    tbody.innerHTML = '';

    tasks.forEach((task, idx) => {
      const tr = document.createElement('tr');
      tr.dataset.id = task.id;
      tr.draggable = true;

      tr.innerHTML = `
        <td class="drag-handle" title="ドラッグで並び替え">⠿</td>
        <td class="cell-id">${task.id}</td>
        <td><input type="text"  value="${esc(task.name)}"     placeholder="タスク名"
              onchange="update(${task.id},'name',this.value)"></td>
        <td><input type="date"  value="${esc(task.deadline)}"
              onchange="update(${task.id},'deadline',this.value)"></td>
        <td><textarea rows="1"  placeholder="メモ"
              onchange="update(${task.id},'memo',this.value)"
              oninput="autoResize(this)">${esc(task.memo)}</textarea></td>
        <td><button class="del-btn" onclick="deleteTask(${task.id})" title="削除">×</button></td>
      `;

      attachDnD(tr, idx);
      tbody.appendChild(tr);
    });

    // resize textareas after render
    tbody.querySelectorAll('textarea').forEach(autoResize);

    // update sort arrows
    document.querySelectorAll('thead th.sortable').forEach(th => {
      th.classList.remove('sorted');
      const arrow = th.querySelector('.sort-arrow');
      arrow.textContent = '↕';
    });
    if (sortCol) {
      const cols = ['id','name','deadline','memo'];
      const idx  = cols.indexOf(sortCol) + 1; // +1 for drag col
      const th   = document.querySelectorAll('thead th.sortable')[cols.indexOf(sortCol)];
      if (th) {
        th.classList.add('sorted');
        th.querySelector('.sort-arrow').textContent = sortDir === 1 ? '↑' : '↓';
      }
    }
  }

  // ── Task ops ───────────────────────────────────────────
  function addTask() {
    tasks.push({ id: nextId++, name: '', deadline: '', memo: '' });
    save();
    render();
    // focus the name input of the new row
    const rows = document.querySelectorAll('#task-body tr');
    if (rows.length) {
      const input = rows[rows.length - 1].querySelector('input[type="text"]');
      if (input) input.focus();
    }
  }

  function update(id, field, value) {
    const task = tasks.find(t => t.id === id);
    if (task) { task[field] = value; save(); }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  // ── Sort ───────────────────────────────────────────────
  function sortBy(col) {
    if (sortCol === col) sortDir *= -1;
    else { sortCol = col; sortDir = 1; }

    tasks.sort((a, b) => {
      const av = a[col] ?? '';
      const bv = b[col] ?? '';
      if (av < bv) return -sortDir;
      if (av > bv) return  sortDir;
      return 0;
    });
    save();
    render();
  }

  // ── Drag & Drop ────────────────────────────────────────
  let dragIdx = null;

  function attachDnD(tr, idx) {
    tr.addEventListener('dragstart', e => {
      dragIdx = idx;
      tr.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    tr.addEventListener('dragend', () => {
      tr.classList.remove('dragging');
      document.querySelectorAll('#task-body tr').forEach(r => r.classList.remove('drag-over'));
    });
    tr.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('#task-body tr').forEach(r => r.classList.remove('drag-over'));
      tr.classList.add('drag-over');
    });
    tr.addEventListener('drop', e => {
      e.preventDefault();
      if (dragIdx === null || dragIdx === idx) return;
      const [moved] = tasks.splice(dragIdx, 1);
      tasks.splice(idx, 0, moved);
      sortCol = null; // clear sort when manually reordered
      dragIdx = null;
      save();
      render();
    });
  }

  // ── Helpers ────────────────────────────────────────────
  function esc(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  // ── Init ───────────────────────────────────────────────
  load();
  render();
</script>
</body>
</html>
