<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク管理</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Menlo", "Monaco", "Courier New", monospace;
      font-size: 13px;
      background: #f5f2eb;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 32px 20px;
    }

    header {
      max-width: 1000px;
      margin: 0 auto 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-bar {
      max-width: 1000px;
      margin: 0 auto;
      border-top: 1px solid #1a1a1a;
      border-bottom: 1px solid #1a1a1a;
      padding: 6px 0;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    button.add-btn {
      padding: 3px 10px;
      background: transparent;
      color: #1a1a1a;
      border: 1px solid #1a1a1a;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      letter-spacing: 0.04em;
    }
    button.add-btn:hover { background: #1a1a1a; color: #f5f2eb; }

    .table-wrap {
      max-width: 1000px;
      margin: 0 auto;
      background: #faf8f3;
      border: 1px solid #1a1a1a;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    col.col-drag   { width: 24px; }
    col.col-done   { width: 36px; }
    col.col-id     { width: 60px; }
    col.col-name   { width: auto; }
    col.col-dead   { width: 140px; }
    col.col-memo   { width: 260px; }
    col.col-del    { width: 32px; }

    thead th {
      background: #1a1a1a;
      color: #f5f2eb;
      padding: 6px 8px;
      text-align: left;
      font-weight: normal;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-right: 1px solid #333;
      user-select: none;
      white-space: nowrap;
    }
    thead th:last-child { border-right: none; }
    thead th.sortable { cursor: pointer; }
    thead th.sortable:hover { background: #333; }
    thead th .sort-arrow { margin-left: 4px; opacity: 0.5; }
    thead th.sorted .sort-arrow { opacity: 1; }

    tbody tr {
      border-bottom: 1px solid #d8d3c8;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #ede9e0; }
    tbody tr.drag-over { background: #e0dbd0; outline: 1px dashed #888; outline-offset: -1px; }
    tbody tr.dragging  { opacity: 0.35; }

    td {
      padding: 2px 4px;
      vertical-align: middle;
      border-right: 1px solid #d8d3c8;
    }
    td:last-child { border-right: none; }

    .drag-handle {
      cursor: grab;
      color: #bbb;
      text-align: center;
      font-size: 11px;
      padding: 4px 2px;
      user-select: none;
      letter-spacing: -1px;
    }
    .drag-handle:hover { color: #666; }
    .drag-handle:active { cursor: grabbing; }

    .cell-id {
      text-align: right;
      padding-right: 4px;
    }
    .cell-id input {
      color: #999;
      text-align: right;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      width: 100%;
      padding: 4px 6px;
    }

    td input[type="text"],
    td input[type="date"],
    td textarea {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      padding: 4px 6px;
      font-size: 13px;
      font-family: inherit;
      color: inherit;
      outline: none;
      resize: none;
    }
    td input[type="text"]:focus,
    td input[type="date"]:focus,
    td textarea:focus {
      border-color: #888;
      background: #fff;
    }
    td textarea {
      min-height: 28px;
      line-height: 1.4;
      overflow: hidden;
      color: #555;
    }

    .del-btn {
      background: none;
      border: none;
      color: #bbb;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      padding: 4px 6px;
      display: block;
      margin: 0 auto;
      line-height: 1;
    }
    .del-btn:hover { color: #1a1a1a; }

    .tick-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      color: #999;
      padding: 4px 4px;
      display: block;
      margin: 0 auto;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }
    .tick-btn:hover { color: #1a1a1a; }

    tbody tr.done td { opacity: 0.45; }
    tbody tr.done td input,
    tbody tr.done td textarea { text-decoration: line-through; }

    tbody tr.overdue .task-name { color: #c0392b; font-weight: 600; }

    .input-error { border-color: #c0392b !important; background: #fff5f5 !important; }

    .date-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .date-wrap input[type="text"] { flex: 1; }
    .date-hidden {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 0;
      height: 0;
    }
    .date-icon {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 11px;
      color: #bbb;
      cursor: pointer;
      padding: 0 4px;
      flex-shrink: 0;
      line-height: 1;
    }
    .date-icon:hover { color: #1a1a1a; }

    footer {
      max-width: 1000px;
      margin: 12px auto 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-right { display: flex; gap: 16px; }

    .clear-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 11px;
      color: #aaa;
      cursor: pointer;
      letter-spacing: 0.04em;
      padding: 4px 0;
    }
    .clear-btn:hover { color: #c0392b; }

    .empty-msg {
      text-align: center;
      color: #999;
      padding: 48px 0;
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .dialog-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(245,242,235,0.7);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .dialog-overlay.open { display: flex; }

    .dialog-box {
      background: #faf8f3;
      border: 1px solid #1a1a1a;
      padding: 20px 24px;
      min-width: 260px;
      font-family: inherit;
    }
    .dialog-box p {
      font-size: 12px;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
      color: #1a1a1a;
    }
    .dialog-box p::before {
      content: '> ';
      color: #999;
    }
    .dialog-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .dialog-actions button {
      padding: 3px 14px;
      font-size: 12px;
      font-family: inherit;
      letter-spacing: 0.06em;
      cursor: pointer;
      border: 1px solid #1a1a1a;
      background: transparent;
      color: #1a1a1a;
    }
    .dialog-actions button.btn-yes {
      background: #1a1a1a;
      color: #f5f2eb;
    }
    .dialog-actions button:hover { opacity: 0.7; }
  </style>
</head>
<body>

<div class="dialog-overlay" id="dialog-overlay">
  <div class="dialog-box">
    <p id="dialog-msg">このタスクを削除しますか?</p>
    <div class="dialog-actions">
      <button onclick="dialogResolve(false)">NO</button>
      <button class="btn-yes" onclick="dialogResolve(true)">YES</button>
    </div>
  </div>
</div>

<header>
  <h1>タスク管理</h1>
  <button class="add-btn" onclick="addTask()">+ タスクを追加</button>
</header>
<div class="header-bar"></div>

<div class="table-wrap">
  <table>
    <colgroup>
      <col class="col-drag">
      <col class="col-done">
      <col class="col-id">
      <col class="col-name">
      <col class="col-dead">
      <col class="col-memo">
      <col class="col-del">
    </colgroup>
    <thead>
      <tr>
        <th></th>
        <th></th>
        <th class="sortable" onclick="sortBy('num')">
          No <span class="sort-arrow">↕</span>
        </th>
        <th class="sortable" onclick="sortBy('name')">
          タスク名 <span class="sort-arrow">↕</span>
        </th>
        <th class="sortable" onclick="sortBy('deadline')">
          期限 <span class="sort-arrow">↕</span>
        </th>
        <th class="sortable" onclick="sortBy('memo')">
          メモ <span class="sort-arrow">↕</span>
        </th>
        <th></th>
      </tr>
    </thead>
    <tbody id="task-body"></tbody>
  </table>
  <div id="empty-msg" class="empty-msg" style="display:none">タスクがありません。「＋ タスクを追加」で追加してください。</div>
</div>

<footer>
  <div style="display:flex;gap:16px">
    <button class="clear-btn" id="copy-btn" onclick="copyList()">⎘ copy list</button>
    <button class="clear-btn" id="copy-done-btn" onclick="copyDone()">⎘ copy done</button>
  </div>
  <div class="footer-right">
    <button class="clear-btn" onclick="clearDone()">✓ clear done</button>
    <button class="clear-btn" onclick="clearAll()">✕ clear all</button>
  </div>
</footer>

<script>
  // ── State ──────────────────────────────────────────────
  let tasks = [];
  let nextKey = 1;
  let sortCol = null;
  let sortDir = 1; // 1=asc, -1=desc
  const today = new Date().toISOString().slice(0, 10);

  // ── Persistence ────────────────────────────────────────
  function save() {
    localStorage.setItem('tasknote', JSON.stringify({ tasks, nextKey }));
  }

  function load() {
    try {
      const raw = localStorage.getItem('tasknote');
      if (!raw) return;
      const data = JSON.parse(raw);
      // migrate old format: id → _key + num
      tasks = (data.tasks || []).map(t => ({
        _key: t._key ?? t.id ?? nextKey++,
        num:  t.num  ?? t.id ?? '',
        name: t.name ?? '',
        deadline: /^\d{4}-\d{2}-\d{2}$/.test(t.deadline) ? t.deadline : '',
        memo: t.memo ?? '',
        done: t.done ?? false,
      }));
      nextKey = data.nextKey ?? data.nextId ?? (tasks.length + 1);
      tasks = tasks.filter(t => t.num || t.name || t.deadline || t.memo);
    } catch (_) {}
  }

  // ── Render ─────────────────────────────────────────────
  function render() {
    const tbody = document.getElementById('task-body');
    const emptyMsg = document.getElementById('empty-msg');

    emptyMsg.style.display = tasks.length === 0 ? '' : 'none';
    tbody.innerHTML = '';

    tasks.forEach((task, idx) => {
      const tr = document.createElement('tr');
      tr.dataset.key = task._key;
      tr.draggable = true;

      if (task.done) tr.classList.add('done');
      if (!task.done && task.deadline && task.deadline < today) tr.classList.add('overdue');

      tr.innerHTML = `
        <td class="drag-handle" title="ドラッグで並び替え">⠿</td>
        <td><button class="tick-btn" onclick="toggleDone(${task._key})">${task.done ? '[x]' : '[&nbsp;]'}</button></td>
        <td class="cell-id"><input type="text" inputmode="numeric" maxlength="4"
              value="${esc(task.num)}"
              onchange="update(${task._key},'num',this.value.replace(/[^0-9]/g,'').slice(0,4))"
              oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,4)"></td>
        <td><input type="text" class="task-name" value="${esc(task.name)}" placeholder="タスク名"
              onchange="update(${task._key},'name',this.value)"></td>
        <td><div class="date-wrap">
              <input type="text" inputmode="numeric" maxlength="8" placeholder="YY-MM-DD"
                value="${esc(toDisplayDate(task.deadline))}"
                oninput="fmtDateYY(this)"
                onchange="validateDateYY(this,${task._key})">
              <input type="date" class="date-hidden"
                value="${esc(task.deadline)}"
                onchange="syncFromPicker(this,${task._key})">
              <button class="date-icon" tabindex="-1"
                onclick="this.previousElementSibling.showPicker()">▾</button>
            </div></td>
        <td><textarea rows="1"  placeholder="メモ"
              onchange="update(${task._key},'memo',this.value)"
              oninput="autoResize(this)">${esc(task.memo)}</textarea></td>
        <td><button class="del-btn" onclick="deleteTask(${task._key})" title="削除">×</button></td>
      `;

      attachDnD(tr, idx);
      tbody.appendChild(tr);
    });

    // resize textareas after render
    tbody.querySelectorAll('textarea').forEach(autoResize);

    // update sort arrows
    document.querySelectorAll('thead th.sortable').forEach(th => {
      th.classList.remove('sorted');
      const arrow = th.querySelector('.sort-arrow');
      arrow.textContent = '↕';
    });
    if (sortCol) {
      const cols = ['num', 'name', 'deadline', 'memo'];
      const idx  = cols.indexOf(sortCol) + 1; // +1 for drag col
      const th   = document.querySelectorAll('thead th.sortable')[cols.indexOf(sortCol)];
      if (th) {
        th.classList.add('sorted');
        th.querySelector('.sort-arrow').textContent = sortDir === 1 ? '↑' : '↓';
      }
    }
  }

  // ── Task ops ───────────────────────────────────────────
  function addTask() {
    tasks.push({ _key: nextKey++, num: '', name: '', deadline: '', memo: '', done: false });
    save();
    render();
    const rows = document.querySelectorAll('#task-body tr');
    if (rows.length) {
      const input = rows[rows.length - 1].querySelector('input[type="text"]');
      if (input) input.focus();
    }
  }

  function update(key, field, value) {
    const task = tasks.find(t => t._key === key);
    if (task) { task[field] = value; save(); }
  }

  function toggleDone(key) {
    const task = tasks.find(t => t._key === key);
    if (!task) return;
    task.done = !task.done;
    save();
    render();
  }

  let dialogResolve = null;

  function showDialog(msg) {
    document.getElementById('dialog-msg').textContent = msg;
    document.getElementById('dialog-overlay').classList.add('open');
    return new Promise(resolve => {
      dialogResolve = (result) => {
        document.getElementById('dialog-overlay').classList.remove('open');
        resolve(result);
      };
    });
  }

  function flashBtn(btn, msg, reset) {
    btn.textContent = msg;
    setTimeout(() => btn.textContent = reset, 1500);
  }

  async function copyList() {
    const btn = document.getElementById('copy-btn');
    if (tasks.length === 0) { flashBtn(btn, '— nothing to copy', '⎘ copy list'); return; }
    const lines = tasks.map(t => '- ' + (t.name || ''));
    await navigator.clipboard.writeText(lines.join('\n'));
    flashBtn(btn, '✓ copied!', '⎘ copy list');
  }

  async function copyDone() {
    const btn = document.getElementById('copy-done-btn');
    const done = tasks.filter(t => t.done);
    if (done.length === 0) { flashBtn(btn, '— nothing to copy', '⎘ copy done'); return; }
    const lines = done.map(t => '- ' + (t.name || ''));
    await navigator.clipboard.writeText(lines.join('\n'));
    flashBtn(btn, '✓ copied!', '⎘ copy done');
  }

  async function clearDone() {
    if (!tasks.some(t => t.done)) return;
    const ok = await showDialog('完了済みタスクを削除しますか?');
    if (!ok) return;
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  }

  async function clearAll() {
    if (tasks.length === 0) return;
    const ok = await showDialog('全タスクを削除しますか?');
    if (!ok) return;
    tasks = [];
    save();
    render();
  }

  async function deleteTask(key) {
    const ok = await showDialog('このタスクを削除しますか?');
    if (!ok) return;
    tasks = tasks.filter(t => t._key !== key);
    save();
    render();
  }

  // ── Sort ───────────────────────────────────────────────
  function sortBy(col) {
    if (sortCol === col) sortDir *= -1;
    else { sortCol = col; sortDir = 1; }

    tasks.sort((a, b) => {
      const av = a[col] ?? '';
      const bv = b[col] ?? '';
      if (av < bv) return -sortDir;
      if (av > bv) return  sortDir;
      return 0;
    });
    save();
    render();
  }

  // ── Drag & Drop ────────────────────────────────────────
  let dragIdx = null;

  function attachDnD(tr, idx) {
    tr.addEventListener('dragstart', e => {
      dragIdx = idx;
      tr.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    tr.addEventListener('dragend', () => {
      tr.classList.remove('dragging');
      document.querySelectorAll('#task-body tr').forEach(r => r.classList.remove('drag-over'));
    });
    tr.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('#task-body tr').forEach(r => r.classList.remove('drag-over'));
      tr.classList.add('drag-over');
    });
    tr.addEventListener('drop', e => {
      e.preventDefault();
      if (dragIdx === null || dragIdx === idx) return;
      const [moved] = tasks.splice(dragIdx, 1);
      tasks.splice(idx, 0, moved);
      sortCol = null; // clear sort when manually reordered
      dragIdx = null;
      save();
      render();
    });
  }

  // ── Helpers ────────────────────────────────────────────
  function esc(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function toDisplayDate(iso) {
    const m = iso && iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? m[1].slice(2) + '-' + m[2] + '-' + m[3] : '';
  }

  function toISODate(display) {
    const m = display && display.match(/^(\d{2})-(\d{2})-(\d{2})$/);
    return m ? '20' + m[1] + '-' + m[2] + '-' + m[3] : '';
  }

  function fmtDateYY(el) {
    const d = el.value.replace(/\D/g, '').slice(0, 6);
    if (d.length > 4)      el.value = d.slice(0,2) + '-' + d.slice(2,4) + '-' + d.slice(4);
    else if (d.length > 2) el.value = d.slice(0,2) + '-' + d.slice(2);
    else                   el.value = d;
    el.classList.remove('input-error');
  }

  function validateDateYY(el, key) {
    const val = el.value.trim();
    if (val === '') {
      el.classList.remove('input-error');
      el.nextElementSibling.value = '';
      update(key, 'deadline', '');
      return;
    }
    const m = val.match(/^(\d{2})-(\d{2})-(\d{2})$/);
    const mo = m && parseInt(m[2], 10);
    const dy = m && parseInt(m[3], 10);
    if (!m || mo < 1 || mo > 12 || dy < 1 || dy > 31) {
      el.classList.add('input-error');
      return;
    }
    el.classList.remove('input-error');
    const iso = toISODate(val);
    el.nextElementSibling.value = iso;
    update(key, 'deadline', iso);
  }

  function syncFromPicker(pickerEl, key) {
    const iso = pickerEl.value;
    pickerEl.previousElementSibling.value = toDisplayDate(iso);
    pickerEl.previousElementSibling.classList.remove('input-error');
    update(key, 'deadline', iso);
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  // ── Init ───────────────────────────────────────────────
  load();
  render();
</script>
</body>
</html>
